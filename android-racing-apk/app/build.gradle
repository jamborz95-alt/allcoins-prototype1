plugins {
    id "com.android.application"
}

android {
    namespace "com.allcoins.racingstandalone"
    compileSdk 35

    defaultConfig {
        applicationId "com.allcoins.racingstandalone"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    androidResources {
        noCompress += ["glb"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

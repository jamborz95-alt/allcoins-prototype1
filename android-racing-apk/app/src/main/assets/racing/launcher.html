<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d17">
<title>ALLCOINS Drag Racing</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d17;color:#fff;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080d17}
#transfer{position:fixed;inset:0;z-index:100;background:rgba(5,10,18,.96);display:grid;place-items:center;padding:22px}
#transfer[hidden]{display:none}
.panel{width:min(520px,94vw);padding:22px;border:1px solid #d6ad54;border-radius:18px;background:linear-gradient(145deg,#18263a,#0b121e);box-shadow:0 18px 60px #000b;text-align:center}
.brand{font-size:13px;letter-spacing:.22em;color:#e9b94f;font-weight:900}
h1{font-size:21px;margin:12px 0 8px}
#status{font-size:13px;line-height:1.5;color:#d1dbe7;min-height:42px}
.track{height:9px;border-radius:9px;background:#28374a;overflow:hidden;margin:18px 0 9px}
#fill{height:100%;width:0;background:linear-gradient(90deg,#bd8c32,#ffe39b);transition:width .12s linear}
#percent{font-size:12px;color:#f2d28b;font-weight:800}
#retry{display:none;margin-top:16px;border:0;border-radius:10px;padding:12px 20px;background:#e9b94f;color:#131923;font-weight:900}
.note{font-size:10px;color:#9eacbd;margin-top:12px}
</style>
</head>
<body>
<iframe id="game" title="ALLCOINS Drag Racing" src="./racing-game.html" allow="fullscreen; autoplay" allowfullscreen></iframe>
<div id="transfer">
  <div class="panel">
    <div class="brand">ALLCOINS RACING</div>
    <h1>Подготовка ВАЗ-2107</h1>
    <div id="status">Загружаем гоночную сцену и настоящую 3D-модель автомобиля из APK…</div>
    <div class="track"><div id="fill"></div></div>
    <div id="percent">0%</div>
    <button id="retry" type="button">Повторить загрузку</button>
    <div class="note">Модель GLB хранится внутри приложения. После первой загрузки интернет для одиночной гонки не нужен.</div>
  </div>
</div>
<script>
(() => {
  "use strict";
  const game = document.getElementById("game");
  const overlay = document.getElementById("transfer");
  const status = document.getElementById("status");
  const fill = document.getElementById("fill");
  const percent = document.getElementById("percent");
  const retry = document.getElementById("retry");
  const CHUNK_SIZE = 512 * 1024;
  let loading = false;
  let transferNo = 0;

  function progress(message, value) {
    status.textContent = message;
    const p = Math.max(0, Math.min(100, value));
    fill.style.width = p + "%";
    percent.textContent = Math.round(p) + "%";
  }

  function fail(message) {
    loading = false;
    status.textContent = message;
    retry.style.display = "inline-block";
  }

  function sendError(message) {
    try {
      game.contentWindow.postMessage({type:"allcoins:car-model-error", message}, location.origin);
    } catch (_) {}
  }

  function sendChunk(transferId, index, byteOffset, bytes) {
    const chunk = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    game.contentWindow.postMessage({
      type: "allcoins:car-model-chunk",
      transferId,
      index,
      byteOffset,
      buffer: chunk
    }, location.origin, [chunk]);
  }

  async function deliverModel() {
    if (loading) return;
    loading = true;
    retry.style.display = "none";
    overlay.hidden = false;
    progress("Читаем встроенный файл ВАЗ-2107 GLB…", 0);
    try {
      const metaResponse = await fetch("./model-info.json", {cache:"no-store"});
      if (!metaResponse.ok) throw new Error("Не удалось прочитать сведения о модели: HTTP " + metaResponse.status);
      const meta = await metaResponse.json();
      const expectedBytes = Number(meta.bytes);
      if (!Number.isSafeInteger(expectedBytes) || expectedBytes < 20 || expectedBytes > 104857600) {
        throw new Error("Некорректный размер встроенной модели.");
      }

      const response = await fetch("./vaz-2107.glb", {cache:"force-cache"});
      if (!response.ok || !response.body) throw new Error("Не удалось открыть GLB из APK: HTTP " + response.status);
      const transferId = "apk-vaz2107-" + Date.now() + "-" + (++transferNo);
      const totalChunks = Math.ceil(expectedBytes / CHUNK_SIZE);

      game.contentWindow.postMessage({type:"allcoins:car-model-loading"}, location.origin);
      game.contentWindow.postMessage({
        type:"allcoins:car-model-start",
        transferId,
        fileName: meta.fileName || "old_car_-_vaz_2107.glb",
        byteLength: expectedBytes,
        chunkSize: CHUNK_SIZE,
        totalChunks,
        remoteVersion: meta.updatedAt || "bundled-in-apk"
      }, location.origin);

      const reader = response.body.getReader();
      let staging = new Uint8Array(CHUNK_SIZE);
      let used = 0;
      let index = 0;
      let byteOffset = 0;

      while (true) {
        const result = await reader.read();
        if (result.done) break;
        let incoming = result.value;
        let cursor = 0;
        while (cursor < incoming.length) {
          const amount = Math.min(CHUNK_SIZE - used, incoming.length - cursor);
          staging.set(incoming.subarray(cursor, cursor + amount), used);
          used += amount;
          cursor += amount;

          if (used === CHUNK_SIZE) {
            sendChunk(transferId, index, byteOffset, staging);
            index++;
            byteOffset += used;
            staging = new Uint8Array(CHUNK_SIZE);
            used = 0;
            progress("Передаём GLB в игровую сцену · " + (byteOffset / 1048576).toFixed(1) + " МБ", byteOffset / expectedBytes * 100);
            await new Promise(resolve => setTimeout(resolve, 0));
          }
        }
      }

      if (used > 0) {
        sendChunk(transferId, index, byteOffset, staging.subarray(0, used));
        index++;
        byteOffset += used;
      }
      if (byteOffset !== expectedBytes || index !== totalChunks) {
        throw new Error("Размер GLB не совпал с метаданными: " + byteOffset + " из " + expectedBytes + " байт.");
      }

      progress("Файл передан. Подготавливаем геометрию, материалы и текстуры автомобиля…", 100);
      const started = Date.now();
      let detected = false;
      while (Date.now() - started < 90000) {
        try {
          const badge = game.contentDocument && game.contentDocument.getElementById("garageCarStatus");
          const badgeText = badge ? badge.textContent || "" : "";
          if (badgeText.includes("GLB ✓")) {
            detected = true;
            break;
          }
          if (badgeText.includes("ОШИБКА ОТКРЫТИЯ")) {
            throw new Error("Игровая сцена не смогла прочитать GLB-модель.");
          }
        } catch (error) {
          if (String(error).includes("не смогла прочитать")) throw error;
        }
        await new Promise(resolve => setTimeout(resolve, 300));
      }
      if (!detected) throw new Error("Модель передана, но игровой экран не подтвердил её загрузку.");
      loading = false;
      progress("ВАЗ-2107 загружен. Приятной игры!", 100);
      setTimeout(() => { overlay.hidden = true; }, 700);
    } catch (error) {
      const message = error && error.message ? error.message : "Не удалось загрузить модель.";
      sendError(message);
      fail(message);
    }
  }

  window.addEventListener("message", event => {
    if (event.source !== game.contentWindow || event.origin !== location.origin) return;
    const data = event.data || {};
    if (data.type === "allcoins:request-car-model") {
      void deliverModel();
      return;
    }
    if (data.type === "allcoins:racing:request") {
      const requestId = typeof data.requestId === "string" ? data.requestId : "";
      if (!requestId) return;
      game.contentWindow.postMessage({
        type:"allcoins:racing:response",
        requestId,
        ok:false,
        error:"В автономном APK доступна одиночная гонка. Онлайн-комнаты, профиль и сетевые функции гаража работают в Telegram Mini App."
      }, location.origin);
    }
  });

  retry.addEventListener("click", () => void deliverModel());
  game.addEventListener("load", () => {
    progress("Игровая сцена открыта. Запускаем загрузку автомобиля…", 0);
    setTimeout(() => {
      if (!loading) {
        // The game requests its GLB immediately after the scene initializes.
        status.textContent = "Сцена готова. Ожидаем запрос модели от игрового движка…";
      }
    }, 1200);
  });
})();
</script>
</body>
</html>

name: Build ALLCOINS VAZ-2107 3D Showroom APK

on:
  push:
    branches:
      - android/vaz2107-showroom-safe
    paths:
      - "android-racing-apk/**"
      - ".github/workflows/fetch-vaz-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vaz2107-showroom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout showroom project
        uses: actions/checkout@v4

      - name: Download and verify the saved VAZ-2107 GLB
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="android-racing-apk/app/src/main/assets/racing"
          mkdir -p model-artifact/chunks "$ASSETS"
          BASE="https://allcoins-engine-a-allcoins95.msk1.amvera.tech"
          curl --fail --show-error --silent --location --retry 8 --retry-all-errors --retry-delay 4 --connect-timeout 20 \
            "$BASE/api/racing/vaz-2107.glb?info=1" \
            -o model-artifact/model-info.json
          cat model-artifact/model-info.json
          python3 - <<'PY'
          import json
          d = json.load(open("model-artifact/model-info.json"))
          if d.get("status") != "ok" or d.get("contentType") != "model/gltf-binary":
              raise SystemExit("Unexpected model metadata: " + repr(d))
          n = int(d.get("bytes", 0))
          if not 20 <= n <= 104857600:
              raise SystemExit(f"Unexpected GLB size: {n}")
          print(f"Preparing {n:,} byte GLB in 4 MiB ranges")
          PY
          TOTAL=$(python3 -c 'import json; print(json.load(open("model-artifact/model-info.json"))["bytes"])')
          CHUNK=$((4 * 1024 * 1024))
          START=0
          INDEX=0
          while [ "$START" -lt "$TOTAL" ]; do
            END=$((START + CHUNK - 1))
            if [ "$END" -ge "$TOTAL" ]; then END=$((TOTAL - 1)); fi
            FILE=$(printf "model-artifact/chunks/%03d.bin" "$INDEX")
            HEADERS=$(mktemp)
            echo "Fetching GLB bytes $START-$END of $TOTAL"
            curl --fail --show-error --silent --location --retry 8 --retry-all-errors --retry-delay 4 \
              --connect-timeout 20 --max-time 180 \
              -H "Range: bytes=$START-$END" -D "$HEADERS" \
              "$BASE/api/racing/vaz-2107.glb" -o "$FILE"
            STATUS=$(awk 'BEGIN{IGNORECASE=1} /^HTTP\//{s=$2} END{print s}' "$HEADERS")
            ACTUAL=$(wc -c < "$FILE")
            EXPECTED=$((END - START + 1))
            if [ "$STATUS" != "206" ] || [ "$ACTUAL" -ne "$EXPECTED" ]; then
              echo "Unexpected range response: HTTP=$STATUS bytes=$ACTUAL expected=$EXPECTED"
              cat "$HEADERS"
              exit 1
            fi
            rm -f "$HEADERS"
            START=$((END + 1))
            INDEX=$((INDEX + 1))
          done
          cat model-artifact/chunks/*.bin > model-artifact/vaz-2107.glb
          python3 - <<'PY'
          import json, pathlib, struct, hashlib
          p = pathlib.Path("model-artifact/vaz-2107.glb")
          data = p.read_bytes()
          if len(data) < 20:
              raise SystemExit("Downloaded GLB is too small")
          magic, version, declared = struct.unpack("<III", data[:12])
          if magic != 0x46546c67 or version != 2 or declared != len(data):
              raise SystemExit(f"Invalid GLB header: {magic:#x}, version={version}, declared={declared}, actual={len(data)}")
          info = json.loads(pathlib.Path("model-artifact/model-info.json").read_text())
          if len(data) != int(info["bytes"]):
              raise SystemExit("GLB byte count differs from Amvera metadata")
          report = {"status":"valid GLB 2.0","bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"remoteInfo":info}
          pathlib.Path("model-artifact/report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          cp model-artifact/vaz-2107.glb "$ASSETS/vaz-2107.glb"
          cp model-artifact/model-info.json "$ASSETS/model-info.json"
          test -s "$ASSETS/launcher.html"
          test -s "$ASSETS/showroom.html"
          test -s "$ASSETS/vendor/three-r147.min.js"
          test -s "$ASSETS/vendor/GLTFLoader-r147.js"
          # Never package the old driving/racing screen into this safe showroom APK.
          rm -f "$ASSETS/racing-game.html"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager was not found"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build standalone VAZ-2107 showroom APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-racing-apk :app:assembleDebug
          mkdir -p release-assets
          cp android-racing-apk/app/build/outputs/apk/debug/app-debug.apk release-assets/ALLCOINS-VAZ2107-3D-Showroom.apk
          python3 - <<'PY'
          import hashlib, pathlib, struct, zipfile
          apk = pathlib.Path("release-assets/ALLCOINS-VAZ2107-3D-Showroom.apk")
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = [
                  "assets/racing/launcher.html",
                  "assets/racing/showroom.html",
                  "assets/racing/vendor/three-r147.min.js",
                  "assets/racing/vendor/GLTFLoader-r147.js",
                  "assets/racing/vaz-2107.glb",
                  "assets/racing/model-info.json"
              ]
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("APK is missing showroom assets: " + ", ".join(missing))
              if "assets/racing/racing-game.html" in names:
                  raise SystemExit("Unsafe legacy driving screen must not be packaged in the showroom APK")
              info = z.getinfo("assets/racing/vaz-2107.glb")
              with z.open("assets/racing/vaz-2107.glb") as f:
                  header = f.read(12)
              magic, version, declared = struct.unpack("<III", header)
              if magic != 0x46546c67 or version != 2 or declared != info.file_size:
                  raise SystemExit("Embedded VAZ GLB failed header/size verification")
          print("APK:", apk.stat().st_size, "bytes")
          print("Embedded VAZ-2107 GLB:", info.file_size, "bytes")
          print("APK SHA-256:", hashlib.sha256(apk.read_bytes()).hexdigest())
          PY
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release-assets/ALLCOINS-VAZ2107-3D-Showroom.apk
          "$BUILD_TOOLS/aapt" dump badging release-assets/ALLCOINS-VAZ2107-3D-Showroom.apk | head -n 8

      - name: Upload ALLCOINS VAZ-2107 3D Showroom APK
        uses: actions/upload-artifact@v4
        with:
          name: allcoins-vaz2107-3d-showroom-apk
          path: release-assets/ALLCOINS-VAZ2107-3D-Showroom.apk
          if-no-files-found: error
          retention-days: 30

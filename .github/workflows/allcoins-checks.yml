name: ALLCOINS automatic checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tool
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Durak server game rules and route safeguards
        run: node --check server/server.js && node --check server/twentyone-rules.js && node --check server/seka-router.js && node --check server/seka-rules.js && node --test tests/seka-rules.test.mjs tests/durak-rules.test.mjs tests/durak-action-regression.test.mjs tests/durak-turn-timeout.test.mjs tests/durak-round-flow.test.mjs tests/server-contract.test.mjs
      - name: Test the app in a browser
        run: node tests/seka-fullscreen-smoke.mjs && node tests/smoke-test.mjs && node tests/shared-card-assets-smoke.mjs

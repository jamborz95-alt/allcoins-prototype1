name: ALLCOINS automatic checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get project files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tool
        run: npm init -y && npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Durak server game rules and route safeguards
        run: node --check server/server.js && node --check server/drag-racing-router.js && node --check server/checkers-router.js && node --check server/checkers-game.js && node --check tests/checkers-multiplayer.test.mjs && node --check server/support-router.js && node --check tests/support-router.test.mjs && node --check server/towers-router.js && node --check tests/towers-game-smoke.mjs && node --check server/billiards-router.js && node --check tests/billiards-3d-smoke.mjs && node --check server/uno-router.js && node --check server/commission.js && node --check server/twentyone-rules.js && node --check server/seka-router.js && node --check server/seka-rules.js && node --check server/rps-router.js && node --check server/rps-rules.js && node --test tests/checkers-multiplayer.test.mjs tests/support-router.test.mjs tests/commission-contract.test.mjs tests/rps-rules.test.mjs tests/rps-bot-contract.test.mjs tests/seka-rules.test.mjs tests/durak-rules.test.mjs tests/durak-action-regression.test.mjs tests/durak-turn-timeout.test.mjs tests/durak-round-flow.test.mjs tests/server-contract.test.mjs tests/drag-racing-contract.test.mjs
      - name: Test the app in a browser
        run: node tests/checkers-ui-smoke.mjs && node tests/blockblast-interaction-smoke.mjs && node tests/bomb-game-smoke.mjs && node tests/towers-game-smoke.mjs && node tests/seka-fullscreen-smoke.mjs && node tests/smoke-test.mjs && node tests/support-ui-smoke.mjs && node tests/rps-ui-smoke.mjs && node tests/shared-card-assets-smoke.mjs && node tests/drag-racing-ui-smoke.mjs
      - name: Upload mobile visual test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allcoins-mobile-visual-test
          path: artifacts/*.png
          if-no-files-found: warn
          retention-days: 7

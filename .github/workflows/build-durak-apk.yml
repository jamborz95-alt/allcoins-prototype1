name: Build Durak Online APK

on:
  push:
    branches: [main]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-durak-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install required packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager was not found"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          gradle -p android-apk :app:assembleDebug
          mkdir -p release-assets
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk release-assets/durak-online.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: durak-online-apk
          path: release-assets/durak-online.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Дурак Онлайн APK v1.0.${{ github.run_number }}
          body: |
            Установочный APK Дурак Онлайн.

            Это приложение открывает текущую онлайн-игру в Telegram, чтобы сохранить безопасную авторизацию и работу комнат.
            Файл: durak-online.apk
          files: release-assets/durak-online.apk
          make_latest: true
          fail_on_unmatched_files: true

name: Build ALLCOINS APK

on:
  push:
    branches: [main, build/allcoins-apk]
    paths:
      - "android-apk/**"
      - ".github/workflows/build-durak-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install required packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager was not found"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          gradle -p android-apk :app:assembleDebug
          mkdir -p release-assets
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk release-assets/allcoins.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: allcoins-apk
          path: release-assets/allcoins.apk
          if-no-files-found: error
          retention-days: 30
